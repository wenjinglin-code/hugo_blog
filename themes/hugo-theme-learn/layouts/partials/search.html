<div class="search-box">
  <input type="text" id="search-input" placeholder="搜索知识库...">
  <button id="search-button">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    搜索
  </button>
</div>
<div id="search-results"></div>

<style>
.search-box {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}

#search-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--gh-border-primary);
  border-radius: 6px;
  font-size: 14px;
  background-color: var(--gh-bg-primary);
  transition: var(--gh-transition-fast);
}

#search-input:focus {
  outline: none;
  border-color: var(--gh-primary);
  box-shadow: var(--gh-shadow-focus);
}

#search-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  background-color: var(--gh-primary);
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: var(--gh-transition-fast);
}

#search-button:hover {
  background-color: var(--gh-primary-hover);
}

#search-results {
  margin-top: 16px;
}

#search-results p {
  color: var(--gh-text-secondary);
  margin-bottom: 16px;
}

#search-results mark {
  background-color: #fff3cd;
  color: #856404;
  padding: 0 2px;
  border-radius: 2px;
}

.search-result {
  margin-bottom: 16px;
  padding: 16px;
  border: 1px solid var(--gh-border-primary);
  border-radius: 6px;
  background: var(--gh-bg-primary);
  transition: var(--gh-transition-fast);
}

.search-result:hover {
  border-color: var(--gh-primary);
  box-shadow: var(--gh-shadow-sm);
}

.search-result h3 {
  margin: 0 0 8px;
  font-size: 16px;
}

.search-result h3 a {
  color: var(--gh-text-link);
  text-decoration: none;
  font-weight: 600;
}

.search-result h3 a:hover {
  color: var(--gh-text-link-hover);
  text-decoration: underline;
}

.search-result .snippet-link {
  color: var(--gh-text-secondary);
  text-decoration: none;
  display: block;
  font-size: 14px;
  line-height: 1.6;
  transition: color 0.2s;
}

.search-result .snippet-link:hover {
  color: var(--gh-text-link);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('search-input');
  const searchButton = document.getElementById('search-button');
  const searchResults = document.getElementById('search-results');
  
  function getBasePath() {
    const pathParts = window.location.pathname.split('/').filter(p => p);
    if (pathParts.length > 0 && pathParts[0] !== '') {
      return '/' + pathParts[0];
    }
    return '';
  }
  
  function performSearch() {
    const query = searchInput.value.trim();
    if (!query) {
      searchResults.innerHTML = '';
      return;
    }
    
    const basePath = getBasePath();
    const indexPath = basePath + '/index.json';
    
    fetch(indexPath)
      .then(response => {
        if (!response.ok) throw new Error('无法加载搜索索引');
        return response.json();
      })
      .then(posts => {
        const queryLower = query.toLowerCase();
        const results = [];
        
        posts.forEach(post => {
          const titleMatch = post.title.toLowerCase().includes(queryLower);
          const contentMatch = post.content && post.content.toLowerCase().includes(queryLower);
          const categoryMatch = post.categories && post.categories.some(c => c.toLowerCase().includes(queryLower));
          const tagMatch = post.tags && post.tags.some(t => t.toLowerCase().includes(queryLower));
          
          if (titleMatch || contentMatch || categoryMatch || tagMatch) {
            let snippet = '';
            if (contentMatch && post.content) {
              const contentLower = post.content.toLowerCase();
              const index = contentLower.indexOf(queryLower);
              const start = Math.max(0, index - 50);
              const end = Math.min(post.content.length, index + query.length + 100);
              snippet = post.content.substring(start, end);
              if (start > 0) snippet = '...' + snippet;
              if (end < post.content.length) snippet = snippet + '...';
            }
            
            results.push({
              title: post.title,
              link: post.permalink,
              snippet: snippet
            });
          }
        });
        
        displayResults(results, query);
      })
      .catch(function(error) {
        console.error('搜索出错:', error);
        searchResults.innerHTML = '<p>搜索功能暂时不可用，请稍后再试。</p>';
      });
  }
  
  function highlightText(text, query) {
    if (!query) return text;
    const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }
  
  function displayResults(results, query) {
    if (results.length === 0) {
      searchResults.innerHTML = '<p>未找到与 "' + query + '" 相关的结果。</p>';
      return;
    }
    
    let html = '<p>找到 ' + results.length + ' 个结果：</p>';
    results.forEach(result => {
      const highlightedTitle = highlightText(result.title, query);
      const highlightedSnippet = highlightText(result.snippet || '', query);
      const encodedQuery = encodeURIComponent(query);
      const linkToTop = result.link;  // 跳转到文章开头
      const linkToContent = result.link + '?q=' + encodedQuery;  // 跳转到关键词位置
      html += '<div class="search-result"><h3><a href="' + linkToTop + '">' + highlightedTitle + '</a></h3>';
      if (result.snippet) {
        html += '<p><a href="' + linkToContent + '" class="snippet-link">' + highlightedSnippet + '</a></p>';
      }
      html += '</div>';
    });
    
    searchResults.innerHTML = html;
  }


  
  searchButton.addEventListener('click', performSearch);
  searchInput.addEventListener('keyup', function(event) {
    if (event.key === 'Enter') {
      performSearch();
    }
  });
});
</script>
