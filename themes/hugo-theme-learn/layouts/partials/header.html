<header class="header">
  <div class="header-left">
    <a href="https://github.com/wenjinglin-code/hugo_blog" class="site-logo" title="{{ site.Title }}" target="_blank" rel="noopener">
      <svg height="28" width="28" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.27-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A8.012 8.013 0 0 1 0 8c0-4.42 3.58-8 8-8z"/>
      </svg>
    </a>
    <a href="https://github.com/wenjinglin-code/hugo_blog" class="site-title">{{ site.Title }}</a>
  </div>
  <nav class="nav">
    <button class="mobile-menu-toggle" aria-label="切换菜单">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <ul class="nav-list">
      {{ range site.Menus.main }}
      <li>
        <a href="{{ .URL }}" {{ if or ($.IsMenuCurrent "main" .) (and ($.IsHome) (eq .Name "首页")) }}class="active"{{ end }}>
          {{ .Name }}
        </a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>

<style>
/* 移动端菜单按钮 */
.mobile-menu-toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  color: var(--gh-text-secondary);
  border-radius: 6px;
  transition: var(--gh-transition-fast);
}

.mobile-menu-toggle:hover {
  background-color: var(--gh-hover-bg);
  color: var(--gh-text-primary);
}

@media (max-width: 768px) {
  .mobile-menu-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .nav-list {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--gh-bg-primary);
    border-bottom: 1px solid var(--gh-border-primary);
    padding: 8px;
    box-shadow: var(--gh-shadow-md);
    flex-direction: column;
    gap: 4px;
    z-index: 99;
  }
  
  .nav-list.active {
    display: flex;
  }
  
  .nav-list li {
    width: 100%;
    margin-right: 0;
  }
  
  .nav-list li a {
    width: 100%;
    padding: 10px 12px;
  }
}
</style>

<script>
// 移动端菜单切换
document.addEventListener('DOMContentLoaded', function() {
  const menuToggle = document.querySelector('.mobile-menu-toggle');
  const navList = document.querySelector('.nav-list');
  
  if (menuToggle && navList) {
    menuToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      navList.classList.toggle('active');
    });
    
    // 点击菜单外部关闭
    document.addEventListener('click', function(e) {
      if (!menuToggle.contains(e.target) && !navList.contains(e.target)) {
        navList.classList.remove('active');
      }
    });
  }
});
</script>
